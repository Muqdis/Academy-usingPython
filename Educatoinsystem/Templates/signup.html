{% comment %} <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
</head>
<body>
    <h2>Create Your Account</h2>

    <!-- Google Signup -->
    <a href="{% provider_login_url 'google' %}">Sign Up with Google</a>
    
    <hr>
    
    <!-- Form Signup -->
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Sign Up</button>
    </form>
</body>
</html> {% endcomment %}
