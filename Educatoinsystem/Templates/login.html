<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Education System</title>
    <style>
        /* Reset default styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header */
        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px 0;
            text-align: center;
        }

        header h1 {
            font-size: 36px;
        }

        /* Navigation */
        nav {
            background-color: #34495e;
            padding: 10px 0;
            text-align: center;
        }

        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        /* Main container */
        .login-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px 20px;
        }

        .login-box {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: center;
        }

        .login-box h2 {
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .login-box form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .login-box label {
            text-align: left;
            font-weight: bold;
            color: #34495e;
        }

        .login-box input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .login-box button {
            padding: 12px;
            border: none;
            border-radius: 5px;
            background-color: #2980b9;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .login-box button:hover {
            background-color: #1f6391;
        }

        .login-box p {
            margin-top: 10px;
        }

        .login-box p a {
            color: #2980b9;
            text-decoration: none;
        }

        .login-box p a:hover {
            text-decoration: underline;
        }

        /* Error message */
        .error-message {
            color: red;
            font-weight: bold;
        }

        /* Footer */
        footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 15px 0;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <h1>Education System</h1>
    </header>

    <!-- Navigation -->
    <nav>
        <a href="{% url 'homepage' %}">Home</a>
        <a href="{% url 'aboutus' %}">About Us</a>
        <a href="{% url 'courses' %}">Courses</a>
        <a href="{% url 'login' %}">Login</a>
        <a href="{% url 'signup' %}">Signup</a>
    </nav>

    <!-- Login Form -->
    <div class="login-container">
        <div class="login-box">
            <h2>Login to Your Account</h2>

            {% if error %}
                <p class="error-message">{{ error }}</p>
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <label for="username">Username</label>
                <input type="text" name="username" id="username" placeholder="Enter your username" required>

                <label for="password">Password</label>
                <input type="password" name="password" id="password" placeholder="Enter your password" required>

                <button type="submit">Login</button>
            </form>

            <p>Don't have an account? <a href="{% url 'signup' %}">Sign Up</a></p>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        &copy; 2025 Education System. All Rights Reserved.
    </footer>

</body>
</html>
